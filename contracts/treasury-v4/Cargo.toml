[package]
name = "sol2near-treasury-v4"
version = "0.1.0"
edition = "2021"
description = "SOL2NEAR TreasuryV4 (V4.1 pilot, NOT deployed): 90/8/2 intake, one allowlisted Ref Classic pool with decimals checked on-chain, on-chain price-impact/slippage/deadline guards, LP custody, leftover recovery and exit (testnet/sandbox only)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
