[package]
name = "sol2near-treasury-dcl"
version = "0.1.0"
edition = "2021"
description = "SOL2NEAR TreasuryDCL (V4.2A, LOCAL ONLY, NOT deployed): 90/8/2 intake, one allowlisted Rhea DCL pool, USDC route via DCL HotZap, concentrated-liquidity position NFT held for the creator, fee claims, exit by NFT transfer (testnet/sandbox only)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
