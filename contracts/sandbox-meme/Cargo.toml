[package]
name = "sol2near-sandbox-meme"
version = "0.1.0"
edition = "2021"
description = "SANDBOX test token for the V4.1 pilot (NOT deployed, no value): plain NEP-141 + NEP-145, fixed supply minted once, no tax, no mint, no admin"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
near-contract-standards = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
