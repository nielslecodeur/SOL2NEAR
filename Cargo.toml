[workspace]
resolver = "2"
members = ["contracts/treasury", "contracts/fuel", "contracts/treasury-v4", "contracts/sandbox-meme"]
# Local near-workspaces run (Linux/WSL only): its own lockfile, never part of the contract builds.
exclude = ["sandbox-tests"]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
