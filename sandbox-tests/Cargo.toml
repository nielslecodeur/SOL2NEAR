[package]
name = "sol2near-sandbox-tests"
version = "0.1.0"
edition = "2021"
publish = false
description = "V4.1 LOCAL SANDBOX run (near-workspaces): TreasuryV4 + sandbox token against the real Ref and Tidepool USDC wasm fetched from testnet. Not a public-network proof."

[dev-dependencies]
near-workspaces = "0.24"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde_json = "1"
# WSL has no libssl-dev/pkg-config (installing them needs sudo): build OpenSSL from source instead.
openssl = { version = "0.10", features = ["vendored"] }
